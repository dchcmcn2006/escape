<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방탈출 게임 - 불안의 자물쇠를 열어라!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes unlock {
            0% { transform: rotateZ(0deg); }
            50% { transform: rotateZ(-15deg); }
            100% { transform: rotateZ(0deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
            50% { text-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        .header p {
            color: #b8860b;
            font-size: 16px;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .team-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .team-card:hover {
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .team-card.shaking {
            animation: shake 0.5s;
        }

        .team-name {
            color: #d4af37;
            margin: 0 0 16px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .locks-display {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 36px;
            position: relative;
            min-height: 50px;
        }

        .lock-icon {
            position: relative;
            display: inline-block;
        }

        .lock-icon.unlocking {
            animation: unlock 0.6s;
        }

        .sparkles {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
            animation: sparkle 0.6s ease-out forwards;
        }

        .sparkle:nth-child(1) { left: -15px; animation-delay: 0s; }
        .sparkle:nth-child(2) { animation-delay: 0.1s; }
        .sparkle:nth-child(3) { left: 15px; animation-delay: 0.2s; }

        .lock-label {
            color: #b8860b;
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: bold;
        }

        .input-display {
            background: #0f0f0f;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 12px;
            font-size: 24px;
            letter-spacing: 12px;
            color: #d4af37;
            font-weight: bold;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .keypad button {
            background: #d4af37;
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .keypad button:hover {
            background: #e5c158;
            transform: scale(1.05);
        }

        .keypad button:active {
            transform: scale(0.95);
        }

        .clear-btn {
            grid-column: span 3;
            background: #c41e3a;
            color: #fff;
        }

        .clear-btn:hover {
            background: #e63946;
        }

        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            border: 2px solid #b8860b;
            border-radius: 8px;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .completed-box {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 16px;
            color: #d4af37;
            font-size: 18px;
            font-weight: bold;
        }

        .time-display {
            font-size: 13px;
            margin-top: 8px;
            color: #b8860b;
        }

        .rankings-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto 30px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
        }

        .rankings-title {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .ranking-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 8px;
            border-left: 4px solid #d4af37;
            font-size: 16px;
        }

        .ranking-item.gold {
            background: rgba(212, 175, 55, 0.15);
        }

        .reset-btn {
            background: #c41e3a;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #e63946;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #d4af37;
        }

        .hidden {
            display: none;
        }

        .modal-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
        }

        .modal-overlay.hidden {
            display: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.3) rotateZ(-20deg); opacity: 0; }
            50% { transform: scale(1.15) rotateZ(3deg); opacity: 1; }
            100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
        }

        @keyframes popOut {
            0% { transform: scale(1) rotateZ(0deg); opacity: 1; }
            100% { transform: scale(0.3) rotateZ(-20deg); opacity: 0; }
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #d4af37;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            min-width: 320px;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.4);
            will-change: transform, opacity;
        }

        .modal-content.hiding {
            animation: popOut 0.3s ease-in forwards;
        }

        .modal-content.success {
            border-color: #00ff88;
        }

        .modal-content.error {
            border-color: #ff6b6b;
        }

        .modal-emoji {
            font-size: 50px;
            margin-bottom: 12px;
            display: inline-block;
            animation: bounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-text {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            line-height: 1.5;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #b8860b;
            margin-top: 8px;
        }

        .modal-content.success .modal-text {
            color: #00ff88;
        }

        .modal-content.error .modal-text {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <!-- 팝업 모달 -->
    <div id="modal" class="modal-overlay hidden">
        <div id="modalContent" class="modal-content">
            <div id="modalEmoji" class="modal-emoji">✨</div>
            <div id="modalText" class="modal-text"></div>
            <div id="modalSubtitle" class="modal-subtitle"></div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🔓 방탈출 게임 🔓</h1>
            <p>불안의 자물쇠를 열어라!</p>
        </div>

        <div class="teams-grid" id="teamsGrid"></div>

        <div id="rankingsContainer" class="hidden">
            <div class="rankings-container">
                <h2 class="rankings-title">🎉 최종 순위 🎉</h2>
                <div id="rankingsList"></div>
            </div>
        </div>

        <div class="footer">
            <button class="reset-btn" onclick="resetGame()">게임 리셋</button>
        </div>
    </div>

    <script>
        const ANSWERS = ['538', '863', '809'];
        let gameState = {};
        let startTime = Date.now();

        // 초기화
        function initGame() {
            const saved = localStorage.getItem('escapeGameState');
            if (saved) {
                gameState = JSON.parse(saved);
            } else {
                gameState = {};
                for (let i = 1; i <= 6; i++) {
                    gameState[i] = {
                        locks: [
                            { input: '', solved: false },
                            { input: '', solved: false },
                            { input: '', solved: false }
                        ],
                        currentLock: 0,
                        completedAt: null
                    };
                }
                localStorage.setItem('escapeGameState', JSON.stringify(gameState));
            }
            render();
        }

        function saveState() {
            localStorage.setItem('escapeGameState', JSON.stringify(gameState));
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'correct') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.setValueAtTime(1000, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'error') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.setValueAtTime(200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.log('Sound unavailable');
            }
        }

        function showModal(type, title, message) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            const modalEmoji = document.getElementById('modalEmoji');
            const modalText = document.getElementById('modalText');
            const modalSubtitle = document.getElementById('modalSubtitle');

            // 이전 hiding 클래스 제거
            modalContent.classList.remove('hiding');

            if (type === 'success') {
                modalEmoji.textContent = '✨🎉✨';
                modalContent.className = 'modal-content success';
            } else {
                modalEmoji.textContent = '🤔';
                modalContent.className = 'modal-content error';
            }

            modalText.textContent = title;
            modalSubtitle.textContent = message;
            modal.classList.remove('hidden');

            // 2초 후 사라지기
            setTimeout(() => {
                modalContent.classList.add('hiding');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }, 2000);
        }

        function handleInput(teamId, lockIdx, value) {
            if (value.length > 3) return;
            if (!/^\d*$/.test(value)) return;
            gameState[teamId].locks[lockIdx].input = value;
            saveState();
            render();
        }

        function handleNumButton(teamId, lockIdx, num) {
            const current = gameState[teamId].locks[lockIdx].input;
            if (current.length < 3) {
                handleInput(teamId, lockIdx, current + num);
            }
        }

        function handleClear(teamId, lockIdx) {
            handleInput(teamId, lockIdx, '');
        }

        function handleSubmit(teamId, lockIdx) {
            const input = gameState[teamId].locks[lockIdx].input;
            console.log(`제출: teamId=${teamId}, lockIdx=${lockIdx}, input="${input}", answer="${ANSWERS[lockIdx]}"`);
            if (input === '') return;

            if (input === ANSWERS[lockIdx]) {
                console.log('정답!');
                playSound('correct');
                showModal('success', `축하합니다!`, `${teamId}모둠이 Lock ${lockIdx + 1}을 열었어요!`);
                
                // 애니메이션 실행
                const card = document.querySelector(`[data-team="${teamId}"]`);
                card.style.animation = 'none';
                setTimeout(() => {
                    card.style.animation = 'unlock 0.6s';
                }, 10);

                gameState[teamId].locks[lockIdx].solved = true;

                if (lockIdx < 2) {
                    gameState[teamId].currentLock = lockIdx + 1;
                } else {
                    gameState[teamId].completedAt = Math.floor((Date.now() - startTime) / 1000);
                }

                saveState();
                setTimeout(() => {
                    render();
                }, 800);
            } else {
                playSound('error');
                showModal('error', '다시 한 번 생각해봐!', '입력한 번호가 맞지 않습니다.');
                
                // 진동 애니메이션
                const card = document.querySelector(`[data-team="${teamId}"]`);
                card.classList.add('shaking');
                setTimeout(() => card.classList.remove('shaking'), 500);

                gameState[teamId].locks[lockIdx].input = '';
                saveState();
                render();
            }
        }

        function render() {
            const teamsGrid = document.getElementById('teamsGrid');
            teamsGrid.innerHTML = '';

            for (let teamId = 1; teamId <= 6; teamId++) {
                const team = gameState[teamId];
                const card = createTeamCard(teamId, team);
                teamsGrid.appendChild(card);
            }

            // 순위 표시
            const allCompleted = Object.values(gameState).every(t => t.completedAt !== null);
            if (allCompleted) {
                showRankings();
            } else {
                document.getElementById('rankingsContainer').classList.add('hidden');
            }
        }

        function createTeamCard(teamId, team) {
            const card = document.createElement('div');
            card.className = 'team-card';
            card.setAttribute('data-team', teamId);
            card.innerHTML = `
                <h3 class="team-name">${teamId}모둠</h3>
                <div class="locks-display">
                    ${[0, 1, 2].map(i => `
                        <div class="lock-icon">
                            <span>${team.locks[i].solved ? '🔓' : '🔒'}</span>
                        </div>
                    `).join('')}
                </div>
                ${team.completedAt === null ? `
                    <p class="lock-label">Lock ${team.currentLock + 1} 비밀번호</p>
                    <div class="input-display">
                        ${team.locks[team.currentLock].input.split('').map(() => '●').join(' ') || '○ ○ ○'}
                    </div>
                    <div class="keypad">
                        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
                            <button onclick="handleNumButton(${teamId}, ${team.currentLock}, '${num}')">${num}</button>
                        `).join('')}
                        <button class="clear-btn" onclick="handleClear(${teamId}, ${team.currentLock})">초기화</button>
                        <button onclick="handleNumButton(${teamId}, ${team.currentLock}, '0')">0</button>
                        <button class="clear-btn" style="grid-column: span 2;" onclick="handleClear(${teamId}, ${team.currentLock})">← 삭제</button>
                    </div>
                    <button class="submit-btn" onclick="handleSubmit(${teamId}, ${team.currentLock})">🔓 제출</button>
                ` : `
                    <div class="completed-box">
                        ✨ 완료! ✨
                        <div class="time-display">
                            ${Math.floor(team.completedAt / 60)}분 ${team.completedAt % 60}초
                        </div>
                    </div>
                `}
            `;
            return card;
        }

        function showRankings() {
            const rankings = Object.entries(gameState)
                .filter(([_, t]) => t.completedAt !== null)
                .sort(([_, a], [__, b]) => a.completedAt - b.completedAt);

            const container = document.getElementById('rankingsContainer');
            const list = document.getElementById('rankingsList');

            list.innerHTML = rankings.map(([teamId, team], idx) => {
                const medals = ['🥇', '🥈', '🥉'];
                const medal = medals[idx] || '';
                return `
                    <div class="ranking-item ${idx === 0 ? 'gold' : ''}">
                        ${medal} <strong>${teamId}모둠</strong> - ${Math.floor(team.completedAt / 60)}분 ${team.completedAt % 60}초
                    </div>
                `;
            }).join('');

            container.classList.remove('hidden');
        }

        function resetGame() {
            if (confirm('게임을 리셋하시겠습니까?')) {
                localStorage.removeItem('escapeGameState');
                startTime = Date.now();
                initGame();
            }
        }

        // 시작
        initGame();
    </script>
</body>
</html>
